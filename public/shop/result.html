<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>نتیجه‌ی خرید — میرزاخان</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#0c0818,#160b2e 45%,#0a1230);
    color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{max-width:380px;width:100%;text-align:center;background:linear-gradient(160deg,rgba(30,18,55,.9),rgba(8,10,26,.9));
    border-radius:20px;padding:28px 22px;border:1px solid rgba(130,90,220,.4)}
  .icon{font-size:56px;margin-bottom:10px}
  h2{margin:6px 0 8px;font-size:18px}
  p{color:#c9b8ee;font-size:13.5px;line-height:1.8;margin-bottom:20px}
  .btn{display:block;width:100%;background:linear-gradient(160deg,#7b4fe0,#4a2fb0);border:none;border-radius:12px;
    padding:13px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
  .hint{font-size:11.5px;color:#8a7ab0;margin-top:6px}
</style>
</head>
<body>
  <div class="box">
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">در حال بررسی...</h2>
    <p id="msg"></p>
    <button class="btn" onclick="mkReturnToGame()">🔙 بازگشت به بازی</button>
    <div class="hint">اگه این دکمه اپ رو خودکار باز نکرد، از این صفحه خارج شو و خودت اپ میرزاخان رو باز کن — خریدت (اگه موفق بوده) حتماً رو حسابت ثبت شده.</div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const status = params.get('status');
const msg = params.get('msg') || '';
const icon = document.getElementById('icon'), title = document.getElementById('title'), msgEl = document.getElementById('msg');
if (status === 'success') {
  icon.textContent = '✅'; title.textContent = 'خرید موفق بود!'; msgEl.textContent = msg;
} else {
  icon.textContent = '❌'; title.textContent = 'خرید ناموفق بود'; msgEl.textContent = msg || 'پرداخت تایید نشد. اگه پول کم شده، طی ۱۵ دقیقه خودکار برمی‌گرده.';
}
function mkReturnToGame(){
  // Best-effort: if this page was opened as a script-opened window/tab inside the game's
  // webview, this closes it and drops the user right back into the app underneath. If it
  // was opened in an external browser (Chrome), window.close() is blocked by the browser
  // for windows it didn't script-open itself — in that case the hint text above is the
  // real instruction, since there's no universal way to force-focus another app from a
  // web page.
  try { window.close(); } catch(e) {}
}
</script>
</body>
</html>
