<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirza Khan Admin</title>
<style>
  body{ font-family:Tahoma, sans-serif; background:#10141f; color:#eee; margin:0; }
  header{ background:#1a2030; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #d4a94b;}
  header h1{ font-size:18px; color:#e8cd8a; margin:0;}
  main{ max-width:900px; margin:0 auto; padding:20px;}
  .card{ background:#1a2030; border:1px solid #2c3e66; border-radius:12px; padding:16px; margin-bottom:16px;}
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
  .stat{ background:#141b2e; border-radius:10px; padding:12px; text-align:center;}
  .stat b{ display:block; font-size:20px; color:#d4a94b;}
  table{ width:100%; border-collapse:collapse; font-size:13px;}
  th,td{ padding:8px; text-align:left; border-bottom:1px solid #2c3e66;}
  th{ color:#e8cd8a;}
  button{ background:#d4a94b; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;}
  button.danger{ background:#c1443d; color:#fff;}
  input{ background:#141b2e; border:1px solid #2c3e66; color:#eee; padding:10px; border-radius:8px; width:100%; margin-bottom:8px; box-sizing:border-box;}
  #loginBox{ max-width:320px; margin:80px auto; text-align:center;}
  .tag{ font-size:11px; padding:2px 7px; border-radius:999px; background:#2c3e66;}
  .tag.banned{ background:#c1443d;}
  .hide{ display:none;}
</style>
</head>
<body>

<div id="loginBox" class="card">
  <h2>Admin Login</h2>
  <input id="adminUser" placeholder="Admin username">
  <input id="adminPass" type="password" placeholder="Password">
  <button style="width:100%;padding:12px;" onclick="adminLogin()">Log in</button>
  <p id="loginErr" style="color:#c1443d;font-size:12px;"></p>
</div>

<div id="panel" class="hide">
<header>
  <h1>Mirza Khan Admin Panel</h1>
  <button onclick="logout()">Log out</button>
</header>
<main>
  <div class="card">
    <h3>Overview</h3>
    <div class="stat-grid" id="statsGrid"></div>
  </div>

  <div class="card">
    <h3>Players</h3>
    <table>
      <thead><tr><th>#</th><th>Username</th><th>Level</th><th>Coins</th><th>Stages</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="playersBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Reports</h3>
    <table>
      <thead><tr><th>#</th><th>Reporter</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="reportsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Audit Log</h3>
    <table>
      <thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Detail</th></tr></thead>
      <tbody id="auditBody"></tbody>
    </table>
  </div>
</main>
</div>

<script>
const API = ''; // same origin as this admin page
let adminToken = null;

async function adminLogin(){
  const username = document.getElementById('adminUser').value;
  const password = document.getElementById('adminPass').value;
  const res = await fetch(API + '/api/admin/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if(!res.ok){ document.getElementById('loginErr').textContent = data.error || 'Login failed'; return; }
  adminToken = data.token;
  document.getElementById('loginBox').classList.add('hide');
  document.getElementById('panel').classList.remove('hide');
  loadAll();
}

function logout(){
  adminToken = null;
  document.getElementById('panel').classList.add('hide');
  document.getElementById('loginBox').classList.remove('hide');
}

async function authFetch(url, opts={}){
  opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + adminToken, 'Content-Type':'application/json' });
  return fetch(API + url, opts);
}
